name: Release

# Push a tag like v1.0 to build MalayalamCraft.zip and publish it as a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MalayalamCraft.zip
        run: cd pack && zip -qrX ../MalayalamCraft.zip pack.mcmeta pack.png FONT-LICENSE.txt assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MalayalamCraft.zip \
            --title "MalayalamCraft $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
