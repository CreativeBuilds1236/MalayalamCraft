name: Release

# Builds MalayalamCraft.zip and publishes it as a GitHub release named after VERSION.
# Runs when VERSION or the pack changes on main (or by hand from the Actions tab).
# If a release for that version already exists, nothing happens: bump VERSION to publish a new one.
on:
  push:
    branches: [main]
    paths: ['VERSION', 'pack/**', '.github/release-notes.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build MalayalamCraft.zip
        run: cd pack && zip -qrX ../MalayalamCraft.zip pack.mcmeta pack.png FONT-LICENSE.txt assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump VERSION to publish a new one."
            exit 0
          fi
          gh release create "$TAG" MalayalamCraft.zip \
            --target "$GITHUB_SHA" \
            --title "MalayalamCraft $TAG" \
            --notes-file .github/release-notes.md
